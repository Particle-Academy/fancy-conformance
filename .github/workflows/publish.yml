name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  guard:
    # Generated by pin-github-checks.mjs. Code fetched from another repo runs
    # HERE, in a job holding nothing but `contents: read` -- never in a job that
    # can publish or write. publish needs this job, so it still cannot start
    # until the check has passed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
          BASH_ENV: ""
          ENV: ""
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          # Delete it. A fetched checkout left lying in the workspace is not
          # inert: vitest globbed the checker's own tests out of it and failed
          # a package whose code was fine. Removed with node, not rm -rf,
          # because some of these matrices run on windows-latest where a
          # multi-line run: block is PowerShell and rm -rf is not a command.
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  # No PyPI job, deliberately (2026-09-13). This repository is the suite's own
  # alignment tool, not a product: nobody outside it installs the fixtures. A
  # Python consumer checks this repository out at the tag it pins (see
  # runners/README.md) and puts python/src on its path, so a PyPI leg would
  # publish to nobody. It existed from 2026-08-25 and failed on every tag
  # (no trusted publisher), which read as a broken release rather than an
  # unneeded one. npm and Packagist stay: the TypeScript and PHP consumers
  # install the fixtures from those registries as a dev dependency.

  publish:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` because this workflow also creates the GitHub release
      # and uploads the language-neutral tarball to it. The npm publish itself
      # still needs nothing beyond `id-token: write` — there is no token.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Release gate: a tag with no CHANGELOG entry fails HERE, before the
      # package reaches the registry. A published version whose changes are
      # undocumented cannot be fixed by editing the changelog afterwards — the
      # tarball is already out, and whoever upgraded into it has no way to
      # learn what changed.
      - name: Changelog entry for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::No CHANGELOG.md. Every package keeps one."
            exit 1
          fi
          if ! grep -qE "^## +\\[?v?${VERSION}\\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}. Add one — say what a consumer must DO — then re-tag."
            exit 1
          fi
          # ORDER, not just presence. The check above asks only whether a
          # heading exists SOMEWHERE. fancy-flow's changelog had four sections
          # inserted ABOVE the [Unreleased] marker, so everything appended
          # since -- including 0.49.0 -- landed below them, and reading
          # top-down showed 0.48.1 as newest. That PASSED the presence check.
          #
          # A consumer deciding whether to upgrade reads top-down. Complete but
          # mis-ordered is a truthful-looking lie, and it is invisible to
          # whoever wrote it, because they are looking at their own entry
          # rather than at the file.
          FIRST=$(grep -E '^## ' CHANGELOG.md                   | grep -viE '^## +\[?unreleased\]?'                   | head -1)

          if ! printf '%s' "$FIRST" | grep -qE "^## +\[?v?${VERSION}\]?"; then
            echo "::error::CHANGELOG.md has an entry for ${VERSION}, but it is NOT the first version heading."
            echo "::error::Top of file is: ${FIRST}"
            echo "::error::Move this release above the older entries, then re-tag."
            exit 1
          fi

          echo "Found changelog entry for ${VERSION}, and it is the newest."

      # The fixtures ARE the package. A tag whose VERSION file disagrees with
      # package.json would publish a tarball whose self-reported suite version
      # is a lie — and every runner prints that number into its CI log, so the
      # lie would propagate into other repos' evidence.
      - name: VERSION matches the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$FILE_VERSION" != "$VERSION" ] || [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::tag ${VERSION}, VERSION ${FILE_VERSION}, package.json ${PKG_VERSION} — all three must agree."
            exit 1
          fi
          echo "Version ${VERSION} agrees across the tag, VERSION and package.json."

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
        env:
          update: true # latest patch, not the runner's preinstalled one
      - name: Floor PHP at the PHP2Shell-patched release (CVE-2026-109618/109619)
        run: php -r '$v=$argv[1]??PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION.".".PHP_RELEASE_VERSION; $f=["8.5"=>"8.5.12","8.4"=>"8.4.27","8.3"=>"8.3.36","8.2"=>"8.2.35"][implode(".",array_slice(explode(".",$v),0,2))]??(version_compare($v,"8.6",">=")?"8.6":"8.2.35"); if(version_compare($v,$f,"<")){echo "::error::PHP $v is below the PHP2Shell floor $f".PHP_EOL;exit(1);} echo "PHP $v >= PHP2Shell floor $f".PHP_EOL;'

      - name: Install
        run: |
          npm install
          composer install --no-interaction --prefer-dist

      # Never publish fixtures that have not just been proven to load and agree
      # in both languages. This is the one package where shipping a broken
      # artifact silently weakens every consumer's CI rather than breaking it.
      - name: Test
        run: npm test

      - name: PHP test
        run: vendor/bin/pest

      - name: Both loaders agree
        run: npm run cross-check

      - name: Build
        run: npm run build

      # Trusted Publishing (OIDC) — no token. npm pinned to 11.18.0:
      # npm@latest (12.0.0) breaks --provenance ("Cannot find module 'sigstore'").
      - name: Publish
        run: npx -y npm@11.18.0 publish --provenance --access public

      # The plain tarball is the artifact a Rust, Go or Python CI job fetches —
      # no npm, no Composer, no JavaScript toolchain. Fixtures only.
      - name: Build the language-neutral tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "fancy-conformance-${VERSION}.tar.gz" VERSION suites schema parity runners LICENSE README.md
          sha256sum "fancy-conformance-${VERSION}.tar.gz" > "fancy-conformance-${VERSION}.tar.gz.sha256"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Fixture set ${VERSION}. See CHANGELOG.md." \
            "fancy-conformance-${VERSION}.tar.gz" \
            "fancy-conformance-${VERSION}.tar.gz.sha256" \
          || gh release upload "${GITHUB_REF_NAME}" \
            "fancy-conformance-${VERSION}.tar.gz" \
            "fancy-conformance-${VERSION}.tar.gz.sha256" --clobber

      # Release gate: third-party dependencies must be approved and still
      # maintained BEFORE the tarball reaches the registry. Once it is
      # published, an unapproved or abandoned dependency has already shipped
      # to everyone who upgrades -- the same reason the changelog gate sits
      # here. The allowlist is FETCHED, never vendored: one source of truth,
      # so there is no per-repo copy that can drift out of agreement with it.