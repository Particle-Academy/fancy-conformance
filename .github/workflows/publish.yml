name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` because this workflow also creates the GitHub release
      # and uploads the language-neutral tarball to it. The npm publish itself
      # still needs nothing beyond `id-token: write` — there is no token.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Release gate: a tag with no CHANGELOG entry fails HERE, before the
      # package reaches the registry. A published version whose changes are
      # undocumented cannot be fixed by editing the changelog afterwards — the
      # tarball is already out, and whoever upgraded into it has no way to
      # learn what changed.
      - name: Changelog entry for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::No CHANGELOG.md. Every package keeps one."
            exit 1
          fi
          if ! grep -qE "^## +\\[?v?${VERSION}\\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}. Add one — say what a consumer must DO — then re-tag."
            exit 1
          fi
          # ORDER, not just presence. The check above asks only whether a
          # heading exists SOMEWHERE. fancy-flow's changelog had four sections
          # inserted ABOVE the [Unreleased] marker, so everything appended
          # since -- including 0.49.0 -- landed below them, and reading
          # top-down showed 0.48.1 as newest. That PASSED the presence check.
          #
          # A consumer deciding whether to upgrade reads top-down. Complete but
          # mis-ordered is a truthful-looking lie, and it is invisible to
          # whoever wrote it, because they are looking at their own entry
          # rather than at the file.
          FIRST=$(grep -E '^## ' CHANGELOG.md                   | grep -viE '^## +\[?unreleased\]?'                   | head -1)

          if ! printf '%s' "$FIRST" | grep -qE "^## +\[?v?${VERSION}\]?"; then
            echo "::error::CHANGELOG.md has an entry for ${VERSION}, but it is NOT the first version heading."
            echo "::error::Top of file is: ${FIRST}"
            echo "::error::Move this release above the older entries, then re-tag."
            exit 1
          fi

          echo "Found changelog entry for ${VERSION}, and it is the newest."

      # The fixtures ARE the package. A tag whose VERSION file disagrees with
      # package.json would publish a tarball whose self-reported suite version
      # is a lie — and every runner prints that number into its CI log, so the
      # lie would propagate into other repos' evidence.
      - name: VERSION matches the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$FILE_VERSION" != "$VERSION" ] || [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::tag ${VERSION}, VERSION ${FILE_VERSION}, package.json ${PKG_VERSION} — all three must agree."
            exit 1
          fi
          echo "Version ${VERSION} agrees across the tag, VERSION and package.json."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install
        run: |
          npm install
          composer install --no-interaction --prefer-dist

      # Never publish fixtures that have not just been proven to load and agree
      # in both languages. This is the one package where shipping a broken
      # artifact silently weakens every consumer's CI rather than breaking it.
      - name: Test
        run: npm test

      - name: PHP test
        run: vendor/bin/pest

      - name: Both loaders agree
        run: npm run cross-check

      - name: Build
        run: npm run build

      # Trusted Publishing (OIDC) — no token. npm pinned to 11.18.0:
      # npm@latest (12.0.0) breaks --provenance ("Cannot find module 'sigstore'").
      - name: Publish
        run: npx -y npm@11.18.0 publish --provenance --access public

      # The plain tarball is the artifact a Rust, Go or Python CI job fetches —
      # no npm, no Composer, no JavaScript toolchain. Fixtures only.
      - name: Build the language-neutral tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "fancy-conformance-${VERSION}.tar.gz" VERSION suites schema parity runners LICENSE README.md
          sha256sum "fancy-conformance-${VERSION}.tar.gz" > "fancy-conformance-${VERSION}.tar.gz.sha256"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Fixture set ${VERSION}. See CHANGELOG.md." \
            "fancy-conformance-${VERSION}.tar.gz" \
            "fancy-conformance-${VERSION}.tar.gz.sha256" \
          || gh release upload "${GITHUB_REF_NAME}" \
            "fancy-conformance-${VERSION}.tar.gz" \
            "fancy-conformance-${VERSION}.tar.gz.sha256" --clobber

      # Release gate: third-party dependencies must be approved and still
      # maintained BEFORE the tarball reaches the registry. Once it is
      # published, an unapproved or abandoned dependency has already shipped
      # to everyone who upgrades -- the same reason the changelog gate sits
      # here. The allowlist is FETCHED, never vendored: one source of truth,
      # so there is no per-repo copy that can drift out of agreement with it.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          # Delete it. A fetched checkout left lying in the workspace is not
          # inert: vitest globbed the checker's own tests out of it and failed
          # a package whose code was fine. Removed with node, not rm -rf,
          # because some of these matrices run on windows-latest where a
          # multi-line run: block is PowerShell and rm -rf is not a command.
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  # ---------------------------------------------------------------------- #
  # PyPI
  #
  # THIS JOB DID NOT EXIST UNTIL 2026-08-25, and the workflow was called
  # "Publish to npm" -- accurate, and precisely the problem. The Python loader
  # was promoted into this repo because FOUR consumers had each hand-rolled it
  # and two of their copies had a silent bug. It has 29 tests and a required CI
  # job. It has never been installable: `pip install fancy-conformance` 404s.
  #
  # So the fix for "four consumers wrote their own" shipped to nobody, and
  # nothing reported it -- the npm and Packagist halves published fine, and a
  # green release is a green release. Found when the ship-it preflight was
  # taught that a repo can publish to more than one registry; before that it
  # read the first manifest it found and called this repo ALREADY SHIPPED.
  # ---------------------------------------------------------------------- #

  # Build and publish are separate jobs so `id-token: write` is never held by
  # the job that executes build code.
  build-python:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Require a CHANGELOG entry for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qE "^## +\[?v?${version}\]?" CHANGELOG.md || {
            echo "::error::No CHANGELOG.md entry for ${version}."
            exit 1
          }

      # The Python package declares its own version, and it is the one that
      # goes to PyPI -- so it, not just VERSION, must match the tag. The
      # repo's `every manifest agrees with VERSION` test covers the other
      # direction; this covers the tag.
      - name: Require pyproject.toml to match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"${version}\"$" python/pyproject.toml || {
            echo "::error::python/pyproject.toml does not declare ${version}."
            exit 1
          }

      # `--sdist --wheel` EXPLICITLY, and it is not a style choice.
      #
      # Bare `python -m build` builds the sdist from the source tree and then
      # the wheel FROM THAT SDIST. The wheel's `force-include` reaches OUTSIDE
      # `python/` for the fixture tree (`../suites`, `../schema`, `../VERSION`),
      # and inside an unpacked sdist there is no `..` to reach into -- the
      # sdist's own force-include has already flattened them to its root. So
      # build-via-sdist dies with `Forced include not found: .../VERSION`.
      #
      # Naming both targets builds each from the SOURCE TREE, where those paths
      # resolve. This had never been caught because nothing has ever built this
      # package -- it has no PyPI presence at all, which is the gap this job
      # exists to close.
      - name: Build
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel

      # Assert the artifacts actually CARRY the fixture tree. The fixtures are
      # the product here; a wheel that builds cleanly and ships an EMPTY loader
      # is the failure this repository argues against, and "the build
      # succeeded" does not rule it out.
      #
      # A script rather than an inline check: a heredoc terminator cannot be
      # indented inside a YAML `run:` block, and `>-` folding prefixes the
      # command with a space that Python rejects. Both were tried.
      - name: The artifacts carry the fixture tree
        working-directory: python
        run: python scripts/check_artifacts.py

      - uses: actions/upload-artifact@v4
        with:
          name: python-dists
          path: python/dist/

  publish-python:
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fancy-conformance
    permissions:
      id-token: write        # mandatory for Trusted Publishing; there is no token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dists
          path: dist/
      # Pinned by SHA, not by tag: a mutable reference in exactly this position
      # is what the April 2026 supply-chain compromises exploited.
      # v1.14.2 -- no `password:` (that is the point), attestations default on.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
