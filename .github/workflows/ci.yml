name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # One gate, stated once, that every installing job waits on. It used to sit
  # inline in a single job, which meant the other jobs installed unchecked --
  # a check that finishes beside the thing it guards is a report, not a gate.
  # Prism raised the distinction 2026-09-21; this repo is polyglot, so the
  # JS job was gated and the PHP/Python ones were not.
  allowlist:
    name: Third-party allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins.
        shell: bash
        env:
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  node:
    needs: allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Lint
        run: npm run lint

      # NOT `npm test --if-present`. This repository's whole argument is that a
      # green tick over an absent or skipped suite is worse than a red one, so
      # the one job that must never silently no-op is its own.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  php:
    needs: allowlist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]
    steps:
      - uses: actions/checkout@v7

      # A missing toolchain is a FAILURE, not a skip. `skipIf(!HAS_PHP)`
      # returning green is the specific mechanism that hid two-way drift for
      # months in holy-sheet and dark-slide, which is why PHP is installed here
      # rather than detected.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install
        run: composer install --no-interaction --prefer-dist

      - name: Test
        run: vendor/bin/pest

  python:
    needs: allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # This job did not exist until 2026-08-23, while AGENTS.md said all four
      # loaders were required CI jobs. The Python loader and its 27 tests ran
      # nowhere. In the repository whose entire argument is that a claim about
      # coverage must be a test result rather than a sentence.
      # `dependency-groups` (PEP 735), not an extra — so it is `pip install
      # --group`, not `.[dev]`. Getting this wrong installs the package without
      # pytest and the next step fails for a reason unrelated to the loader.
      # `--group` needs pip >= 25.1, so the upgrade is part of the step rather
      # than an assumption about the runner image.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./python --group ./python/pyproject.toml:test --group ./python/pyproject.toml:lint

      # Lint was declared (the `lint` group) and never run, so the loader and
      # the golden scripts collected ruff errors that surfaced in CONSUMERS'
      # CI instead, which check this repo out inside their workspace: an
      # unsorted import here turned fancy-catalog-py red. scripts/ uses the
      # loader's config because it has none of its own.
      - name: Lint
        run: |
          (cd python && ruff check . && ruff format --check .)
          ruff check --config python/pyproject.toml scripts
          ruff format --config python/pyproject.toml --check scripts

      - name: Test
        working-directory: python
        run: python -m pytest -q

  rust:
    needs: allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        working-directory: rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test

  cross-language:
    runs-on: ubuntu-latest
    needs: [node, php, python, rust]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          composer install --no-interaction --prefer-dist

      # The claim this repository makes is that two loaders reading one fixture
      # set produce the SAME verdicts. Asserting that inside either language's
      # own suite would be asserting it against itself.
      - name: Both loaders agree
        run: npm run cross-check
